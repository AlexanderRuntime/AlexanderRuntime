<svg viewBox="0 0 1000 168" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Backend focus — JavaScript, Java, C#, and C++">
  <style>
    :root { --bone: #444444; --rule: #C0C0C0; --muted: #888888; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --rule: #444444; --muted: #777777; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .rise { opacity: 0; animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from { opacity:0;transform:translateY(6px); } to { opacity:1;transform:translateY(0); } }
    .a1{animation-delay:.1s} .a2{animation-delay:.2s} .a3{animation-delay:.3s} .a4{animation-delay:.4s} .a5{animation-delay:.5s} .a6{animation-delay:.6s} .a7{animation-delay:.7s}
    @media (prefers-reduced-motion: reduce) { .rise { animation: none; opacity: 1; } }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; }
  :root { --bone:#FFFFFF; --muted:#FFFFFF; --dim:#FFFFFF; --rule:#FFFFFF; --accent:#FFFFFF; --node-bg:#000000; --core-bg:#000000; --ghost:#FFFFFF; --ink:#FFFFFF; --paper:#000000; --ghost:#FFFFFF; }
</style>
  <line x1="220" y1="8" x2="220" y2="154" stroke="var(--rule)" stroke-width="1" opacity=".4"/>
  <text class="mono rise a1" x="48" y="32" font-size="12" fill="var(--muted)" letter-spacing="2">JAVASCRIPT</text>
  <text class="mono rise a1" x="246" y="32" font-size="15" fill="var(--bone)">JS</text>
  <text class="mono rise a2" x="48" y="70" font-size="12" fill="var(--muted)" letter-spacing="2">JAVA</text>
  <text class="mono rise a2" x="246" y="70" font-size="15" fill="var(--bone)">Java</text>
  <text class="mono rise a3" x="48" y="108" font-size="12" fill="var(--muted)" letter-spacing="2">C SHARP</text>
  <text class="mono rise a3" x="246" y="108" font-size="15" fill="var(--bone)">C#</text>
  <text class="mono rise a4" x="48" y="146" font-size="12" fill="var(--muted)" letter-spacing="2">C PLUS PLUS</text>
  <text class="mono rise a4" x="246" y="146" font-size="15" fill="var(--bone)">C++</text>
</svg>