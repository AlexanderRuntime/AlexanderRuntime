<svg viewBox="0 0 1000 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Telemetry: 73% JavaScript, 16% Java, 4% C++, 4% C#, 2% Python, 1% Other. Shipping velocity 2021 to 2026: trend accelerating. 38 repositories, 0 projects documented, 4 platforms, unlimited terminal tabs open.">
  <style>
    :root { --bone: #444444; --muted: #888888; --dim: #AAAAAA; --rule: #C0C0C0; --accent: #555555; }
    @media (prefers-color-scheme: dark) { :root { --bone: #DDDDDD; --muted: #777777; --dim: #666666; --rule: #444444; --accent: #AAAAAA; } }
    .mono { font-family: ui-monospace, "SFMono-Regular", "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .bar { transform: scaleX(0); animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes grow { to { transform: scaleX(1); } }
    .g1{transform-origin:48px 0;animation-delay:.3s}.g2{transform-origin:48px 0;animation-delay:.45s}.g3{transform-origin:48px 0;animation-delay:.6s}
    .g4{transform-origin:48px 0;animation-delay:.75s}.g5{transform-origin:48px 0;animation-delay:.9s}.g6{transform-origin:48px 0;animation-delay:1.05s}
    .spark { stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 2.2s cubic-bezier(.6,0,.2,1) .5s forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .dot { opacity: 0; animation: fade .4s ease forwards; }
    .d1{animation-delay:1.0s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}.d4{animation-delay:1.9s}.d5{animation-delay:2.2s}.d6{animation-delay:2.5s}
    @keyframes fade { to { opacity: 1; } }
    .rise { opacity: 0; animation: rise .8s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes rise { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .n1{animation-delay:.5s}.n2{animation-delay:.7s}.n3{animation-delay:.9s}.n4{animation-delay:1.1s}
    .ping { animation: ping 2.2s ease-out infinite; transform-origin: 622px 112px; }
    @keyframes ping { 0%{transform:scale(.4);opacity:.9} 80%,100%{transform:scale(2.8);opacity:0} }
    @media (prefers-reduced-motion: reduce) {
      .bar,.spark,.dot,.rise,.ping { animation: none; }
      .bar{transform:scaleX(1)} .spark{stroke-dashoffset:0} .dot,.rise{opacity:1} .ping{opacity:0}
    }
      :root { --bone: #000000; --muted: #000000; --dim: #000000; --rule: #000000; --accent: #000000; --node-bg: #FFFFFF; --core-bg: #FFFFFF; --ghost: #000000; }
  </style>

  <line x1="48" y1="40" x2="952" y2="40" stroke="var(--rule)"/>
  <text fill="var(--muted)" class="mono" x="48" y="28" font-size="11" letter-spacing="3.5">TELEMETRY — WHAT THE HANDS ARE DOING</text>
  <text fill="var(--muted)" class="mono" x="952" y="28" font-size="11" letter-spacing="3.5" text-anchor="end">FIG. 02</text>
  <line x1="360" y1="64" x2="360" y2="296" stroke="var(--rule)" opacity=".4"/>
  <line x1="688" y1="64" x2="688" y2="296" stroke="var(--rule)" opacity=".4"/>

  <!-- User-provided language distribution; bar widths use a 250px = 100% scale. -->
  <text fill="var(--dim)" class="mono" x="48" y="78" font-size="10" letter-spacing="2.5">LANGUAGE FOCUS</text>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="108">JavaScript</text><rect class="bar g1" x="48" y="116" width="182.5" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="123" text-anchor="end" font-size="10">73%</text></g>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="146">Java</text><rect class="bar g2" x="48" y="154" width="40" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="161" text-anchor="end" font-size="10">16%</text></g>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="184">C++</text><rect class="bar g3" x="48" y="192" width="10" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="199" text-anchor="end" font-size="10">4%</text></g>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="222">C#</text><rect class="bar g4" x="48" y="230" width="10" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="237" text-anchor="end" font-size="10">4%</text></g>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="260">Python</text><rect class="bar g5" x="48" y="268" width="5" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="275" text-anchor="end" font-size="10">2%</text></g>
  <g class="mono" font-size="11"><text fill="var(--bone)" x="48" y="298">Other</text><rect class="bar g6" x="48" y="306" width="2.5" height="6" fill="var(--bone)"/><text fill="var(--muted)" x="330" y="313" text-anchor="end" font-size="10">1%</text></g>
  <!-- shipping velocity -->
  <text fill="var(--dim)" class="mono" x="392" y="78" font-size="10" letter-spacing="2.5">SHIPPING VELOCITY</text>
  <g>
    <line x1="392" y1="252" x2="656" y2="252" stroke="var(--rule)"/>
    <polyline class="spark" points="392,240 440,232 488,210 536,188 584,148 622,112 656,92" stroke="var(--accent)" stroke-width="1.5" fill="none"/>
    <circle class="dot d1" cx="440" cy="232" r="2.5" fill="var(--bone)"/>
    <circle class="dot d2" cx="488" cy="210" r="2.5" fill="var(--bone)"/>
    <circle class="dot d3" cx="536" cy="188" r="2.5" fill="var(--bone)"/>
    <circle class="dot d4" cx="584" cy="148" r="2.5" fill="var(--bone)"/>
    <circle class="ping" cx="622" cy="112" r="4" stroke="var(--accent)" fill="none"/>
    <circle class="dot d5" cx="622" cy="112" r="3" fill="var(--accent)"/>
    <text fill="var(--dim)" class="mono" x="392" y="272" font-size="9.5" letter-spacing="1.5">2021</text>
    <text fill="var(--dim)" class="mono" x="550" y="272" font-size="9.5" letter-spacing="1.5">2024</text>
    <text fill="var(--dim)" class="mono" x="656" y="272" text-anchor="end" font-size="9.5" letter-spacing="1.5">2026</text>
    <text fill="var(--muted)" class="mono dot d6" x="392" y="300" font-size="10" letter-spacing="1.5">trend — <tspan fill="var(--accent)">accelerating</tspan></text>
  </g>

  <!-- User-provided counters. The velocity curve is a stylized illustration. -->
  <g class="mono">
    <g class="rise n1"><text fill="var(--bone)" x="714" y="118" font-size="40">38</text><text fill="var(--muted)" x="780" y="112" font-size="10" letter-spacing="1">REPOSITORIES</text></g>
    <g class="rise n2"><text fill="var(--bone)" x="714" y="178" font-size="40">0</text><text fill="var(--muted)" x="780" y="172" font-size="10" letter-spacing="1">PROJECTS DOCUMENTED</text></g>
    <g class="rise n3"><text fill="var(--bone)" x="714" y="238" font-size="40">4</text><text fill="var(--muted)" x="780" y="232" font-size="10" letter-spacing="1">PLATFORMS</text></g>
    <g class="rise n4"><text fill="var(--accent)" x="714" y="298" font-size="40">∞</text><text fill="var(--muted)" x="780" y="292" font-size="10" letter-spacing="1">TERMINAL TABS OPEN</text></g>
  </g>
</svg>
